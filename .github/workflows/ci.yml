name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer validate --strict --no-check-publish
      - run: composer audit --locked --no-dev --abandoned=report
      - run: composer audit --locked
        continue-on-error: true
      - run: docker compose config -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - uses: ramsey/composer-install@4.0.0
        with:
          composer-options: --no-scripts
      - run: composer check

  tests:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        experimental: [false]
        include:
          - php: '8.5'
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - uses: ramsey/composer-install@4.0.0
        with:
          composer-options: --no-scripts
      - run: composer test

  outdated:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - uses: ramsey/composer-install@4.0.0
        with:
          composer-options: --no-scripts
      - run: vendor/bin/swiss-knife breakpoint

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build -d --wait
      - name: README flow
        run: |
          curl --retry 30 --retry-all-errors --retry-delay 2 -sf -X POST http://localhost:8000/api/products -H 'content-type: application/json' --data '{"name": "Foo Bar","price": "123.45"}' | grep -q '"status":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/products -H 'content-type: application/json' --data '{}')" = 400
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
