services:
  app:
    container_name: recruitment-task-symfony-api-products-app
    build:
      context: .
      dockerfile_inline: |
        FROM php:8.4-cli-alpine
        COPY --from=composer:latest /usr/bin/composer /usr/bin/composer
        RUN apk add --no-cache git unzip
        WORKDIR /app
        COPY . .
        RUN composer config --global allow-plugins true && composer install --no-interaction --no-progress
    command: >
      sh -c "php bin/console doctrine:migrations:migrate --no-interaction
      && php -S 0.0.0.0:8000 -t public public/index.php"
    ports:
      - '8000:8000'
